<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bug AI Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    section { border: 1px solid #ddd; border-radius: 12px; padding: 18px; margin: 16px 0; }
    button { margin: 4px; padding: 8px 12px; }
    input { padding: 8px; }
    pre { background: #f6f6f6; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>🐛 Bug AI Test</h1>
  <p>这是一个故意包含 4 个 Bug 的本地靶场。目标不是修复这个页面，而是让 AI 找出并修复底层缺陷。</p>

  <section>
    <h2>🥉 青铜：重复提交</h2>
    <input id="submitText" value="hello">
    <button id="submitBtn">快速连点提交</button>
    <pre id="submitOut"></pre>
  </section>

  <section>
    <h2>🥈 白银：刷新状态</h2>
    <input id="filter" placeholder="输入 alpha / beta">
    <button onclick="applyFilter()">应用筛选</button>
    <button onclick="location.reload()">刷新页面</button>
    <pre id="itemsOut"></pre>
  </section>

  <section>
    <h2>💎 钻石：乱序响应</h2>
    <input id="search" placeholder="先输入 old，再快速输入 new">
    <pre id="searchOut"></pre>
  </section>

  <section>
    <h2>👑 王者：认证与授权</h2>
    <button onclick="refreshTwice()">并发刷新 Token</button>
    <button onclick="readOtherUser()">读取 admin 私有数据</button>
    <pre id="authOut"></pre>
  </section>

<script>
async function applyFilter() {
  const q = document.getElementById("filter").value;
  const data = await fetch("/api/items?q=" + encodeURIComponent(q)).then(r => r.json());
  document.getElementById("itemsOut").textContent = JSON.stringify(data, null, 2);
}

// BUG #1: button handler intentionally allows concurrent POST requests.
document.getElementById("submitBtn").onclick = async () => {
  const text = document.getElementById("submitText").value;
  const requests = Array.from({ length: 3 }, () =>
    fetch("/api/submit", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text })
    }).then(r => r.json())
  );
  const results = await Promise.all(requests);
  document.getElementById("submitOut").textContent = JSON.stringify(results, null, 2);
};

// BUG #2: filter state is not persisted anywhere before reload.

// BUG #3: every response writes directly to the UI; an older request may finish last.
document.getElementById("search").oninput = async event => {
  const q = event.target.value;
  const data = await fetch("/api/search?q=" + encodeURIComponent(q)).then(r => r.json());
  document.getElementById("searchOut").textContent = JSON.stringify(data, null, 2);
};

// BUG #4: refresh calls are independent and there is no single-flight lock.
async function refreshTwice() {
  const results = await Promise.all([
    fetch("/api/auth/refresh", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ userId: "alice" })
    }).then(r => r.json()),
    fetch("/api/auth/refresh", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ userId: "alice" })
    }).then(r => r.json())
  ]);
  document.getElementById("authOut").textContent = JSON.stringify(results, null, 2);
}

async function readOtherUser() {
  const data = await fetch("/api/private?userId=admin", {
    headers: { authorization: "Bearer demo-user-token" }
  }).then(r => r.json());
  document.getElementById("authOut").textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
